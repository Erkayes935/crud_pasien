services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://postgres:user@103.179.56.158:5434/patients
      DATABASE_URL_DATAHUB: postgresql://datahub_user:pass@103.179.56.158:5433/datahub_db
      CORE_ENGINE_URL: http://core_engine:8002
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env
    working_dir: /app/web
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8001
    depends_on:
      - core_engine
      - redis
    networks:
      - crud_pasien_network

  core_engine:
    build: ./core_engine
    ports:
      - "8002:8002"
    working_dir: /app
    command: uvicorn main:app --host 0.0.0.0 --port 8002
    env_file:
      - ./core_engine/.env
    networks:
      - crud_pasien_network

  celery:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: crud_pasien-celery
    environment:
      DATABASE_URL: postgresql://postgres:user@103.179.56.158:5434/patients
      DATABASE_URL_DATAHUB: postgresql://datahub_user:pass@103.179.56.158:5433/datahub_db
      CORE_ENGINE_URL: http://core_engine:8002
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env
    working_dir: /app/web
    depends_on:
      - redis
      - core_engine
    command: celery -A backend.celery_app.celery_app worker --loglevel=info
    networks:
      - crud_pasien_network

  redis:
    image: redis:7-alpine
    container_name: crud_pasien-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - crud_pasien_network

networks:
  crud_pasien_network:
    driver: bridge

volumes:
  redis_data:
