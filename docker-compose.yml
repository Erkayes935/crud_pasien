services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "8011:8011"
    environment:
      DATABASE_URL: postgresql://postgres:user@103.179.56.158:5434/patients

      CORE_ENGINE_URL: http://core_engine:8002
    env_file:
      - .env
    working_dir: /app/web
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8011
    depends_on:
      - core_engine

  core_engine:
    build: ./core_engine
    ports:
      - "8002:8002"
    working_dir: /app
    command: uvicorn main:app --host 0.0.0.0 --port 8002
    env_file:
      - ./core_engine/.env
