      'bukti_klinis': {

    // Test function
    async function testRegulationModal(fieldName) {
      console.log(`🧪 Testing regulation modal for field: ${fieldName}`);
      
      // Update results display
      document.getElementById('resultsContent').textContent = 
        `Testing ${fieldName}...\nSimulating API call to /regulation_detail...`;
      
      try {
        // Simulate API delay
        await new Promise(resolve => setTimeout(resolve, 500));
        
        // Get mock response
        const mockResponse = mockResponses[fieldName];
        
        // Update results
        document.getElementById('resultsContent').textContent = 
          `✅ Mock Response for "${fieldName}":\n` + JSON.stringify(mockResponse, null, 2);
        
        // Call the actual modal function with mock data
        const regulationContent = renderMultilayerRegulationModal(mockResponse, fieldName, 'Pneumonia');
        openModal(`Regulasi Multilayer: ${fieldName} (Pneumonia)`, regulationContent, { 
          hideDefaultClose: true, 
          disableAutoTitle: true 
        });
        
        console.log('✅ Modal opened successfully!');
        
      } catch (error) {
        console.error('❌ Error in test:', error);
        document.getElementById('resultsContent').textContent = `❌ Error: ${error.message}`;
      }
    }

    // Dummy functions to make the code work (simplified versions)
    function closeNestedModal() {
      const modal = document.getElementById('modalContainer');
      if (modal) {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
    }

    function showFeedbackModalForRegulasi(ruleId, layer) {
      alert(`Mock feedback modal for rule ${ruleId} in layer ${layer}`);
    }
  </script>

  <!-- Include the actual modal functions from claim.modals.js (copy relevant parts) -->
  <script src="test_modal_functions.js"></script>
  
  <!-- Mock script with core modal functions -->
  <script>
    // Copy dari claim.modals.js - fungsi yang diperlukan untuk test
    
    function getLayerLabel(layer) {
      const labels = {
        'permenkes': '🏛️ Permenkes',
        'nasional': '🇮🇩 Nasional',
        'ppk': '🏥 PPK RS', 
        'regional': '🗺️ Regional',
        'rs': '🏨 RS Lokal',
        'bridging': '🔗 Bridging',
        'fraud': '⚠️ Fraud',
        'temporary': '⏰ Temporary'
      };
      return labels[layer] || layer.toUpperCase();
    }

    function getLayerColorClass(layer) {
      const colors = {
        'ppk': 'bg-green-100 text-green-800 dark:bg-green-800 dark:text-green-200',
        'rs': 'bg-blue-100 text-blue-800 dark:bg-blue-800 dark:text-blue-200',
        'nasional': 'bg-red-100 text-red-800 dark:bg-red-800 dark:text-red-200',
        'regional': 'bg-purple-100 text-purple-800 dark:bg-purple-800 dark:text-purple-200',
        'permenkes': 'bg-indigo-100 text-indigo-800 dark:bg-indigo-800 dark:text-indigo-200',
        'bridging': 'bg-cyan-100 text-cyan-800 dark:bg-cyan-800 dark:text-cyan-200',
        'fraud': 'bg-red-100 text-red-800 dark:bg-red-800 dark:text-red-200',
        'temporary': 'bg-yellow-100 text-yellow-800 dark:bg-yellow-800 dark:text-yellow-200'
      };
      return colors[layer] || 'bg-gray-100 text-gray-800 dark:bg-gray-700 dark:text-gray-300';
    }

    // Basic modal function
    function openModal(title, content, options = {}) {
      const modalContainer = document.getElementById('modalContainer');
      const modalContent = modalContainer.querySelector('.modal-content');
      
      modalContent.innerHTML = content;
      modalContainer.classList.remove('hidden');
      modalContainer.classList.add('flex');
    }
  </script>
