{% extends "base.html" %}
{% block content %}
<div class="max-w-xl mx-auto mt-10 p-8 bg-white dark:bg-gray-800 rounded-xl shadow-md">
  <h2 class="text-2xl font-bold mb-6 text-center text-gray-800 dark:text-gray-100">
    {{ "Tambah Pasien" if mode == "add" else "Edit Pasien" }}
  </h2>

  <form method="post" action="{{ url_for('add_patient') if mode == 'add' else url_for('update_patient', patient_id=record.id) }}" class="space-y-5">

    {% for field in fields %}
      {% include "_form_renderer.html" %}
    {% endfor %}

    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

    <div class="flex gap-3">
      <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg font-semibold transition">
        {{ "Tambah" if mode == "add" else "Update" }}
      </button>
      <a href="/patients" class="flex-1 bg-gray-500 hover:bg-gray-600 text-white text-center py-2 rounded-lg transition">
        Batal
      </a>
    </div>
  </form>
</div>
{% endblock %}
