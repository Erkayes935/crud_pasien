{% extends "base.html" %}
{% block content %}
<div x-data="{ tab: 'Umum' }" class="max-w-5xl mx-auto p-6 bg-white dark:bg-gray-800 rounded-xl shadow">
  <h1 class="text-2xl font-bold mb-4">📝 Form Rekam Medis</h1>

  <!-- Tabs -->
  <div class="flex border-b mb-6 space-x-4">
    {% for tab_name, tab_fields in fields.items() %}
      <button class="px-4 py-2"
              :class="tab === '{{ tab_name }}' ? 'border-b-2 border-blue-500 font-bold text-blue-600' : 'text-gray-500'"
              @click="tab='{{ tab_name }}'">
        {{ tab_name }}
      </button>
    {% endfor %}
  </div>

  <form method="post" action="{{ url_for('add_medical_record') if mode=='add' else url_for('update_medical_record', record_id=record.id) }}" class="space-y-4">
    {% for tab_name, tab_fields in fields.items() %}
      <div x-show="tab === '{{ tab_name }}'" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        {% for field in tab_fields %}
          {% include "_form_renderer.html" %}
        {% endfor %}
      </div>
    {% endfor %}

    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="flex gap-3 mt-6">
      <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg">
        {{ "Tambah" if mode == "add" else "Update" }}
      </button>
      <a href="/medical-records" class="flex-1 bg-gray-500 hover:bg-gray-600 text-white text-center py-2 rounded-lg">
        Batal
      </a>
    </div>
  </form>
</div>
{% endblock %}
