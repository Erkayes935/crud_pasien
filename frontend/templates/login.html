{% extends 'base.html' %}

{% block content %}
<div class="flex min-h-screen items-center justify-center bg-gray-100 dark:bg-gray-900">
  <!-- Card -->
  <div class="w-full max-w-sm p-6 bg-white dark:bg-gray-800 rounded-2xl shadow-xl">
    <h1 class="text-2xl font-bold text-center text-gray-800 dark:text-white mb-6">Login</h1>
    <!-- form langsung POST ke backend -->
    <form method="post" action="/auth/login" class="space-y-4">
      <input type="email" name="email" placeholder="Email"
             class="w-full px-3 py-2 rounded-lg border dark:bg-gray-700 dark:text-white" required>
      <input type="password" name="password" placeholder="Password"
             class="w-full px-3 py-2 rounded-lg border dark:bg-gray-700 dark:text-white" required>
      <button type="submit"
              class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg">
        Login
      </button>
    </form>
  </div>
</div>
{% endblock %}
