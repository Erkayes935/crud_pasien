{% extends "base.html" %}
{% block content %}
<div class="max-w-4xl mx-auto p-6 bg-white dark:bg-gray-800 rounded-xl shadow-md mt-10">
  <h2 class="text-2xl font-bold mb-4 text-center text-gray-800 dark:text-gray-100">
    {{ "Tambah Klaim" if mode == "add" else "Edit Klaim" }}
  </h2>

  <form method="post" action="{{ url_for('add_claim') if mode=='add' else url_for('update_claim', id=record.id) }}" class="space-y-6">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      {% for field in fields %}
        {% include "_form_renderer.html" %}
      {% endfor %}
    </div>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

    <div class="flex gap-3">
      <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition">
        {{ "Tambah" if mode == "add" else "Update" }}
      </button>
      <a href="/claims" class="flex-1 bg-gray-500 hover:bg-gray-600 text-white text-center py-2 rounded-lg transition">
        Batal
      </a>
    </div>
  </form>
</div>
{% endblock %}
