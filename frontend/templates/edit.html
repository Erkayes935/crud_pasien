{% extends "base.html" %}
{% block content %}
<div class="bg-white shadow-lg rounded-lg p-6 max-w-lg mx-auto">
  <h1 class="text-2xl font-bold mb-4">Edit Pasien</h1>

  <form action="/edit/{{ patient.id }}" method="post" class="space-y-4">
    <div>
      <label class="block mb-1 font-medium">Nama</label>
      <input type="text" name="nama" value="{{ patient.nama }}" required class="w-full border px-3 py-2 rounded">
    </div>

    <div>
      <label class="block mb-1 font-medium">Tanggal Lahir</label>
      <input type="date" name="tanggal_lahir" value="{{ patient.tanggal_lahir }}" required class="w-full border px-3 py-2 rounded">
    </div>

    <div>
      <label class="block mb-1 font-medium">Tanggal Kunjungan</label>
      <input type="date" name="tanggal_kunjungan" value="{{ patient.tanggal_kunjungan }}" required class="w-full border px-3 py-2 rounded">
    </div>

    <div>
      <label class="block mb-1 font-medium">Diagnosis</label>
      <textarea name="diagnosis" class="w-full border px-3 py-2 rounded">{{ patient.diagnosis }}</textarea>
    </div>

    <div>
      <label class="block mb-1 font-medium">Tindakan</label>
      <textarea name="tindakan" class="w-full border px-3 py-2 rounded">{{ patient.tindakan }}</textarea>
    </div>

    <div>
      <label class="block mb-1 font-medium">Dokter</label>
      <input type="text" name="dokter" value="{{ patient.dokter }}" class="w-full border px-3 py-2 rounded">
    </div>

    <div class="flex justify-between">
      <a href="/" class="px-4 py-2 bg-gray-400 text-white rounded hover:bg-gray-500">Batal</a>
      <button type="submit" class="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600">Update</button>
    </div>
  </form>
</div>
{% endblock %}
