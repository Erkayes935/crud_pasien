<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen Pasien</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
  <!-- Navbar -->
  <nav class="bg-white shadow mb-6">
    <div class="container mx-auto px-4 py-3 flex justify-between items-center">
      <a href="/" class="text-xl font-bold text-blue-600">🏥 PasienApp</a>
      
      <div class="flex items-center space-x-4">
        {% if user %}
          <span class="text-gray-700">Halo, {{ user.role }} {{ user.name or user.email }}</span>
          <a href="/logout" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">Logout</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <!-- Content -->
  <div class="container mx-auto px-4">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
