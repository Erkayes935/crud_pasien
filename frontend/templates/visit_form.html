{% extends "base.html" %}
{% block content %}
<div class="container mx-auto px-4 py-6 max-w-lg">
  <h1 class="text-2xl font-bold mb-6 text-gray-800 dark:text-gray-100">
    {{ "Tambah Kunjungan" if mode == "add" else "Edit Kunjungan" }}
  </h1>

  <form method="post" action="{{ url_for('add_visit') if mode=='add' else url_for('edit_visit', visit_id=record.id) }}" class="space-y-5">
    {% for field in fields %}
      {% include "_form_renderer.html" with context %}
    {% endfor %}

    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

    <div class="flex gap-3">
      <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition">
        {{ "Tambah Kunjungan" if mode == "add" else "Update Kunjungan" }}
      </button>
      <a href="/visits" class="flex-1 bg-gray-500 hover:bg-gray-600 text-white text-center py-2 rounded-lg transition">
        Batal
      </a>
    </div>
  </form>
</div>
{% endblock %}
