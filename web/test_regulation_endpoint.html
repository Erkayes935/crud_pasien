<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Regulation Endpoint</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-2xl font-bold mb-6">Test Regulation Endpoint</h1>
        
        <div class="bg-white p-6 rounded shadow-lg mb-6">
            <h2 class="text-lg font-semibold mb-4">Test Regulation API</h2>
            
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-medium mb-2">Field Name</label>
                    <select id="fieldName" class="w-full p-2 border rounded">
                        <option value="justifikasi">Justifikasi</option>
                        <option value="syarat_klinis">Syarat Klinis</option>
                        <option value="icd10_code">Kode ICD-10</option>
                        <option value="kode_ganda">Kode Ganda</option>
                        <option value="z_code">Z-Code</option>
                        <option value="kode_bpjs_khusus">Kode Khusus BPJS</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">Current Value</label>
                    <input id="currentValue" type="text" class="w-full p-2 border rounded" 
                           placeholder="e.g., Demam tinggi, G91.0, etc." value="Demam tinggi, batuk berdahak">
                </div>
            </div>
            
            <button onclick="testRegulationAPI()" 
                    class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 mb-4">
                Test Regulation API
            </button>
            
            <button onclick="testRegulationModal()" 
                    class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 mb-4 ml-2">
                Test Regulation Modal
            </button>
        </div>
        
        <div id="api-result" class="bg-white p-6 rounded shadow-lg">
            <h3 class="text-lg font-semibold mb-4">API Response:</h3>
            <pre id="response-content" class="bg-gray-100 p-4 rounded text-sm overflow-auto"></pre>
        </div>
    </div>

    <!-- Mock claimRoot untuk testing -->
    <div id="claimRoot" data-claim-id="123" style="display: none;"></div>

    <script src="backend/static/js/claim.modals.js"></script>
    <script>
        async function testRegulationAPI() {
            const fieldName = document.getElementById('fieldName').value;
            const currentValue = document.getElementById('currentValue').value;
            const claimId = '123';
            
            try {
                const url = `/claims/${claimId}/regulations?field_name=${fieldName}&field_type=diagnosis`;
                
                console.log(`Testing: ${url}`);
                document.getElementById('response-content').textContent = `Loading ${url}...`;
                
                const response = await fetch(url);
                const result = await response.json();
                
                document.getElementById('response-content').textContent = JSON.stringify(result, null, 2);
                
                console.log("API Response:", result);
                
            } catch (error) {
                document.getElementById('response-content').textContent = `Error: ${error.message}`;
                console.error("API Error:", error);
            }
        }
        
        async function testRegulationModal() {
            const fieldName = document.getElementById('fieldName').value;
            const currentValue = document.getElementById('currentValue').value;
            const fieldLabel = document.getElementById('fieldName').options[document.getElementById('fieldName').selectedIndex].text;
            
            // Test modal function directly
            await openRegulationDetailModal(fieldName, fieldLabel, currentValue, 1);
        }
        
        // Mock modal function untuk testing standalone
        function openModal(title, content, options = {}) {
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50';
            modal.innerHTML = `
                <div class="bg-white max-w-4xl max-h-screen overflow-auto p-6 rounded shadow-lg relative">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-bold">${title}</h2>
                        <button onclick="this.closest('.fixed').remove()" class="text-red-500 hover:text-red-700 text-xl font-bold">×</button>
                    </div>
                    <div>${content}</div>
                </div>
            `;
            document.body.appendChild(modal);
        }
    </script>
</body>
</html>
