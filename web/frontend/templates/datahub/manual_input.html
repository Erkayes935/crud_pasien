<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manual Input - AI CLAIM Data Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <!-- Select2 for searchable dropdowns -->
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <style>
    /* Custom Select2 styling for dark mode */
    .select2-container--default .select2-selection--single {
      background-color: white;
      border: 1px solid rgb(203 213 225);
      border-radius: 0.5rem;
      height: 3rem;
      padding: 0.5rem 1rem;
    }
    .dark .select2-container--default .select2-selection--single {
      background-color: rgb(55 65 81);
      border-color: rgb(75 85 99);
      color: white;
    }
    .select2-container--default .select2-selection--single .select2-selection__rendered {
      line-height: 2rem;
      color: rgb(30 41 59);
    }
    .dark .select2-container--default .select2-selection--single .select2-selection__rendered {
      color: white;
    }
    .select2-container--default .select2-selection--single .select2-selection__arrow {
      height: 3rem;
    }
    .select2-dropdown {
      border: 1px solid rgb(203 213 225);
      border-radius: 0.5rem;
    }
    .dark .select2-dropdown {
      background-color: rgb(55 65 81);
      border-color: rgb(75 85 99);
    }
    .select2-container--default .select2-results__option {
      padding: 0.5rem 1rem;
    }
    .dark .select2-container--default .select2-results__option {
      color: white;
    }
    .select2-container--default .select2-results__option--highlighted[aria-selected] {
      background-color: rgb(59 130 246);
    }
    .select2-search--dropdown .select2-search__field {
      border: 1px solid rgb(203 213 225);
      border-radius: 0.375rem;
      padding: 0.5rem;
    }
    .dark .select2-search--dropdown .select2-search__field {
      background-color: rgb(31 41 55);
      border-color: rgb(75 85 99);
      color: white;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-blue-50/30 to-slate-50 dark:from-gray-900 dark:via-gray-900 dark:to-gray-800 text-slate-900 dark:text-gray-100 min-h-screen transition-colors duration-300">

<!-- Navbar -->
<nav class="bg-white/80 dark:bg-gray-800/80 backdrop-blur-lg border-b border-slate-200/60 dark:border-gray-700/60 sticky top-0 z-50 shadow-sm transition-colors duration-300">
  <div class="max-w-7xl mx-auto px-6 py-4">
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-4">
        <a href="/dashboard" class="flex items-center space-x-3 group">
          <div class="bg-gradient-to-br from-blue-600 to-blue-700 p-2.5 rounded-xl shadow-lg shadow-blue-500/30">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
            </svg>
          </div>
          <div>
            <h1 class="text-xl font-bold text-slate-800 dark:text-gray-100">Manual Input</h1>
            <p class="text-xs text-slate-500 dark:text-gray-400">Patient | Visit | Medical Record</p>
          </div>
        </a>
      </div>
      <div class="flex items-center space-x-4">
        <button onclick="toggleTheme()" class="p-2 hover:bg-slate-100 dark:hover:bg-gray-700 rounded-lg transition-colors">
          <svg id="iconLight" class="w-5 h-5 text-slate-600 dark:text-gray-300 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
          </svg>
          <svg id="iconDark" class="w-5 h-5 text-slate-600 dark:text-gray-300 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
          </svg>
        </button>
        <a href="/dashboard" class="px-4 py-2 bg-slate-200 dark:bg-gray-700 hover:bg-slate-300 dark:hover:bg-gray-600 text-slate-800 dark:text-white rounded-lg transition-colors text-sm font-medium">
          ← Back to Dashboard
        </a>
      </div>
    </div>
  </div>
</nav>

<!-- Main Content -->
<div class="max-w-5xl mx-auto p-8">

  <!-- Alert Box -->
  <div id="alertBox" class="hidden mb-6 p-4 rounded-xl text-white shadow-lg border border-slate-200 dark:border-gray-700"></div>

  <!-- Tab Navigation -->
  <div class="bg-white/70 dark:bg-gray-800/70 backdrop-blur-sm rounded-xl shadow-xl border border-slate-200/60 dark:border-gray-700/60 overflow-hidden">
    
    <!-- Tab Headers -->
    <div class="flex border-b border-slate-200 dark:border-gray-700">
      <button onclick="switchTab('patient')" id="tab-patient" class="flex-1 px-6 py-4 text-center font-semibold transition-all duration-200 border-b-2 border-blue-500 bg-slate-100 dark:bg-gray-700/50 text-blue-600 dark:text-blue-400">
        Pasien
      </button>
      <button onclick="switchTab('visit')" id="tab-visit" class="flex-1 px-6 py-4 text-center font-semibold transition-all duration-200 border-b-2 border-transparent hover:bg-slate-50 dark:hover:bg-gray-700/30 text-slate-600 dark:text-gray-400">
        Kunjungan
      </button>
      <button onclick="switchTab('medical')" id="tab-medical" class="flex-1 px-6 py-4 text-center font-semibold transition-all duration-200 border-b-2 border-transparent hover:bg-slate-50 dark:hover:bg-gray-700/30 text-slate-600 dark:text-gray-400">
        Rekam Medis
      </button>
    </div>

    <!-- Tab Content -->
    <div class="p-8">

      <!-- PATIENT TAB -->
      <div id="content-patient" class="tab-content">
        <h2 class="text-2xl font-bold mb-6 text-slate-800 dark:text-gray-100">Tambah Pasien Baru</h2>
        <form id="formPatient" class="space-y-6">
          <input type="hidden" name="hospital_id" id="patient_hospital_id" value="">
          
          <div class="grid grid-cols-2 gap-6">
            <div class="col-span-2">
              <label class="block text-sm font-medium text-slate-700 dark:text-gray-300 mb-2">Nama Lengkap Pasien *</label>
              <input type="text" name="nama" required 
                class="w-full px-4 py-3 bg-white dark:bg-gray-700 border border-slate-300 dark:border-gray-600 rounded-lg text-slate-800 dark:text-white focus:ring-2 focus:ring-blue-500 transition"
                placeholder="e.g., Septian Ridho">
              <p class="mt-1 text-xs text-slate-500 dark:text-gray-400">Jangan menggunakan singkatan</p>
            </div>

            <div>
              <label class="block text-sm font-medium text-slate-700 dark:text-gray-300 mb-2">NIK/KTP</label>
              <input type="text" name="no_ktp" 
                class="w-full px-4 py-3 bg-white dark:bg-gray-700 border border-slate-300 dark:border-gray-600 rounded-lg text-slate-800 dark:text-white focus:ring-2 focus:ring-blue-500 transition"
                placeholder="e.g., 3578123456789012">
            </div>

            <div>
              <label class="block text-sm font-medium text-slate-700 dark:text-gray-300 mb-2">No HP</label>
              <input type="text" name="no_hp" 
                class="w-full px-4 py-3 bg-white dark:bg-gray-700 border border-slate-300 dark:border-gray-600 rounded-lg text-slate-800 dark:text-white focus:ring-2 focus:ring-blue-500 transition"
                placeholder="e.g., 081234567890">
            </div>

            <div>
              <label class="block text-sm font-medium text-slate-700 dark:text-gray-300 mb-2">Tanggal Lahir</label>
              <input type="date" name="tanggal_lahir" 
                class="w-full px-4 py-3 bg-white dark:bg-gray-700 border border-slate-300 dark:border-gray-600 rounded-lg text-slate-800 dark:text-white focus:ring-2 focus:ring-blue-500 transition">
            </div>

            <div>
              <label class="block text-sm font-medium text-slate-700 dark:text-gray-300 mb-2">Jenis Kelamin</label>
              <select name="jenis_kelamin" 
                class="w-full px-4 py-3 bg-white dark:bg-gray-700 border border-slate-300 dark:border-gray-600 rounded-lg text-slate-800 dark:text-white focus:ring-2 focus:ring-blue-500 transition">
                <option value="">Pilih...</option>
                <option value="L">Laki-laki</option>
                <option value="P">Perempuan</option>
              </select>
            </div>

            <div class="col-span-2">
              <label class="block text-sm font-medium text-slate-700 dark:text-gray-300 mb-2">Alamat</label>
              <textarea name="alamat" rows="2" 
                class="w-full px-4 py-3 bg-white dark:bg-gray-700 border border-slate-300 dark:border-gray-600 rounded-lg text-slate-800 dark:text-white focus:ring-2 focus:ring-blue-500 transition"
                placeholder="e.g., Jl. Kenari No. 123, Surabaya"></textarea>
            </div>

            <div>
              <label class="block text-sm font-medium text-slate-700 dark:text-gray-300 mb-2">Email</label>
              <input type="email" name="email" 
                class="w-full px-4 py-3 bg-white dark:bg-gray-700 border border-slate-300 dark:border-gray-600 rounded-lg text-slate-800 dark:text-white focus:ring-2 focus:ring-blue-500 transition"
                placeholder="e.g., patient@email.com">
            </div>

            <div>
              <label class="block text-sm font-medium text-slate-700 dark:text-gray-300 mb-2">No Rekam Medis</label>
              <input type="text" name="no_rm" 
                class="w-full px-4 py-3 bg-white dark:bg-gray-700 border border-slate-300 dark:border-gray-600 rounded-lg text-slate-800 dark:text-white focus:ring-2 focus:ring-blue-500 transition"
                placeholder="Optional">
            </div>
          </div>

          <div class="flex justify-end gap-4 pt-4 border-t border-slate-200 dark:border-gray-700">
            <button type="button" onclick="resetForm('formPatient')" 
              class="px-6 py-3 bg-slate-200 dark:bg-gray-700 hover:bg-slate-300 dark:hover:bg-gray-600 text-slate-800 dark:text-white rounded-lg transition-colors">
              Reset
            </button>
            <button type="submit" 
              class="px-8 py-3 bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white rounded-lg shadow-lg shadow-blue-500/30 transition-all duration-200 transform hover:scale-105 font-semibold">
              Simpan
            </button>
          </div>
        </form>
      </div>

      <!-- VISIT TAB -->
      <div id="content-visit" class="tab-content hidden">
        <h2 class="text-2xl font-bold mb-6 text-slate-800 dark:text-gray-100">Tambah Kunjungan Baru</h2>
        <form id="formVisit" class="space-y-6">
          <input type="hidden" name="hospital_id" id="visit_hospital_id" value="">
    
          <!-- Patient Selection -->
          <div class="bg-green-100/50 dark:bg-green-900/20 border border-green-300 dark:border-green-700 rounded-lg p-4 mb-6">
            <h3 class="text-sm font-semibold text-green-700 dark:text-green-300 mb-3">📌 Pilih Pasien</h3>
            <div class="grid grid-cols-1 gap-4">
              <div>
                <label class="block text-sm font-medium text-slate-700 dark:text-gray-300 mb-2">Pasien * <span class="text-xs text-slate-500">(dengan fitur pencarian)</span></label>
                <select name="patient_id" id="visit_patient_id" required
                  class="w-full select2-patient">
                  <option value="">-- Ketik untuk mencari pasien --</option>
                </select>
                <button type="button" onclick="loadPatients()" 
                  class="mt-2 w-full px-4 py-2 bg-green-100 dark:bg-green-900/30 hover:bg-green-200 dark:hover:bg-green-800/40 text-green-700 dark:text-green-300 rounded-lg transition-colors text-sm font-medium">
                  🔍 Muat Daftar Pasien
                </button>
              </div>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-6">
            <div>
              <label class="block text-sm font-medium text-slate-700 dark:text-gray-300 mb-2">Tanggal Kunjungan *</label>
              <input type="date" name="tanggal_kunjungan" required 
                class="w-full px-4 py-3 bg-white dark:bg-gray-700 border border-slate-300 dark:border-gray-600 rounded-lg text-slate-800 dark:text-white focus:ring-2 focus:ring-green-500 transition">
            </div>

            <div>
              <label class="block text-sm font-medium text-slate-700 dark:text-gray-300 mb-2">Jenis Kunjungan</label>
              <select name="jenis_kunjungan" 
                class="w-full px-4 py-3 bg-white dark:bg-gray-700 border border-slate-300 dark:border-gray-600 rounded-lg text-slate-800 dark:text-white focus:ring-2 focus:ring-green-500 transition">
                <option value="Rawat Inap">Rawat Inap</option>
                <option value="Rawat Jalan">Rawat Jalan</option>
                <option value="IGD">IGD</option>
              </select>
            </div>

            <div>
              <label class="block text-sm font-medium text-slate-700 dark:text-gray-300 mb-2">Lama Rawat (hari)</label>
              <input type="number" name="lama_rawat" value="1" min="1" 
                class="w-full px-4 py-3 bg-white dark:bg-gray-700 border border-slate-300 dark:border-gray-600 rounded-lg text-slate-800 dark:text-white focus:ring-2 focus:ring-green-500 transition">
            </div>

            <div>
              <label class="block text-sm font-medium text-slate-700 dark:text-gray-300 mb-2">Poliklinik</label>
              <input type="text" name="poli" 
                class="w-full px-4 py-3 bg-white dark:bg-gray-700 border border-slate-300 dark:border-gray-600 rounded-lg text-slate-800 dark:text-white focus:ring-2 focus:ring-green-500 transition"
                placeholder="e.g., Poli Penyakit Dalam">
            </div>

            <div class="col-span-2">
              <label class="block text-sm font-medium text-slate-700 dark:text-gray-300 mb-2">Nama Dokter</label>
              <input type="text" name="doctor_name" 
                class="w-full px-4 py-3 bg-white dark:bg-gray-700 border border-slate-300 dark:border-gray-600 rounded-lg text-slate-800 dark:text-white focus:ring-2 focus:ring-green-500 transition"
                placeholder="e.g., Dr. Budi Santoso">
            </div>

            <div class="col-span-2">
              <label class="block text-sm font-medium text-slate-700 dark:text-gray-300 mb-2">Keluhan/Gejala</label>
              <textarea name="gejala" rows="3" 
                class="w-full px-4 py-3 bg-white dark:bg-gray-700 border border-slate-300 dark:border-gray-600 rounded-lg text-slate-800 dark:text-white focus:ring-2 focus:ring-green-500 transition"
                placeholder="e.g., Demam tinggi, batuk berdahak"></textarea>
            </div>

            <div class="col-span-2">
              <label class="block text-sm font-medium text-slate-700 dark:text-gray-300 mb-2">Riwayat Penyakit</label>
              <textarea name="riwayat" rows="2" 
                class="w-full px-4 py-3 bg-white dark:bg-gray-700 border border-slate-300 dark:border-gray-600 rounded-lg text-slate-800 dark:text-white focus:ring-2 focus:ring-green-500 transition"
                placeholder="Optional"></textarea>
            </div>
          </div>

          <div class="flex justify-end gap-4 pt-4 border-t border-slate-200 dark:border-gray-700">
            <button type="button" onclick="resetForm('formVisit')" 
              class="px-6 py-3 bg-slate-200 dark:bg-gray-700 hover:bg-slate-300 dark:hover:bg-gray-600 text-slate-800 dark:text-white rounded-lg transition-colors">
              Reset
            </button>
            <button type="submit" 
              class="px-8 py-3 bg-gradient-to-r from-green-600 to-green-700 hover:from-green-700 hover:to-green-800 text-white rounded-lg shadow-lg shadow-green-500/30 transition-all duration-200 transform hover:scale-105 font-semibold">
              Simpan
            </button>
          </div>
        </form>
      </div>

      <!-- MEDICAL RECORD TAB -->
      <div id="content-medical" class="tab-content hidden">
        <h2 class="text-2xl font-bold mb-6 text-slate-800 dark:text-gray-100">Tambah Rekam Medis Baru</h2>
        <form id="formMedical" class="space-y-6">
          
          <!-- Visit Selection -->
          <div class="bg-purple-100/50 dark:bg-purple-900/20 border border-purple-300 dark:border-purple-700 rounded-lg p-4 mb-6">
            <h3 class="text-sm font-semibold text-purple-700 dark:text-purple-300 mb-3">📌 Pilih Kunjungan</h3>
            <div class="grid grid-cols-1 gap-4">
              <div>
                <label class="block text-sm font-medium text-slate-700 dark:text-gray-300 mb-2">Kunjungan * <span class="text-xs text-slate-500">(dengan fitur pencarian)</span></label>
                <select name="visit_id" id="medical_visit_id" required
                  class="w-full select2-visit">
                  <option value="">-- Ketik untuk mencari kunjungan --</option>
                </select>
                <button type="button" onclick="loadVisits()" 
                  class="mt-2 w-full px-4 py-2 bg-purple-100 dark:bg-purple-900/30 hover:bg-purple-200 dark:hover:bg-purple-800/40 text-purple-700 dark:text-purple-300 rounded-lg transition-colors text-sm font-medium">
                  🔍 Muat Kunjungan
                </button>
              </div>
            </div>
          </div>

          <input type="hidden" name="hospital_id" id="medical_hospital_id" value="">

          <!-- Tabs for Medical Record Sections -->
          <div class="bg-white dark:bg-gray-800 rounded-lg border border-slate-200 dark:border-gray-700">
            <div class="flex border-b border-slate-200 dark:border-gray-700 overflow-x-auto">
              <button type="button" onclick="switchMedicalTab('basic')" id="med-tab-basic" 
                class="px-4 py-3 text-sm font-medium border-b-2 border-purple-500 text-purple-600 dark:text-purple-400 whitespace-nowrap">
                📝 Informasi Dasar
              </button>
              <button type="button" onclick="switchMedicalTab('vital')" id="med-tab-vital" 
                class="px-4 py-3 text-sm font-medium border-b-2 border-transparent text-slate-600 dark:text-gray-400 hover:text-slate-800 dark:hover:text-gray-200 whitespace-nowrap">
                💓 Tanda Vital
              </button>
              <button type="button" onclick="switchMedicalTab('lab')" id="med-tab-lab" 
                class="px-4 py-3 text-sm font-medium border-b-2 border-transparent text-slate-600 dark:text-gray-400 hover:text-slate-800 dark:hover:text-gray-200 whitespace-nowrap">
                🧪 Lab & Penunjang
              </button>
              <button type="button" onclick="switchMedicalTab('diagnosis')" id="med-tab-diagnosis" 
                class="px-4 py-3 text-sm font-medium border-b-2 border-transparent text-slate-600 dark:text-gray-400 hover:text-slate-800 dark:hover:text-gray-200 whitespace-nowrap">
                🩺 Diagnosis & Tindakan
              </button>
              <button type="button" onclick="switchMedicalTab('medication')" id="med-tab-medication" 
                class="px-4 py-3 text-sm font-medium border-b-2 border-transparent text-slate-600 dark:text-gray-400 hover:text-slate-800 dark:hover:text-gray-200 whitespace-nowrap">
                💊 Obat & Catatan
              </button>
            </div>

            <div class="p-6">
              <!-- Basic Info Tab -->
              <div id="med-content-basic" class="med-tab-content">
                <div class="grid grid-cols-2 gap-6">
                  <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-gray-300 mb-2">Jenis Rekam Medis *</label>
                    <select name="record_type" required 
                      class="w-full px-4 py-3 bg-white dark:bg-gray-700 border border-slate-300 dark:border-gray-600 rounded-lg text-slate-800 dark:text-white focus:ring-2 focus:ring-purple-500 transition">
                      <option value="admission">Admission (Masuk)</option>
                      <option value="daily">Daily (Harian)</option>
                      <option value="discharge">Discharge (Keluar)</option>
                    </select>
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-gray-300 mb-2">Nama Dokter *</label>
                    <input type="text" name="doctor_name" required 
                      class="w-full px-4 py-3 bg-white dark:bg-gray-700 border border-slate-300 dark:border-gray-600 rounded-lg text-slate-800 dark:text-white focus:ring-2 focus:ring-purple-500 transition"
                      placeholder="Dr. Budi Santoso">
                  </div>
                  <div class="col-span-2">
                    <label class="block text-sm font-medium text-slate-700 dark:text-gray-300 mb-2">Keluhan Utama</label>
                    <textarea name="keluhan" rows="2" 
                      class="w-full px-4 py-3 bg-white dark:bg-gray-700 border border-slate-300 dark:border-gray-600 rounded-lg text-slate-800 dark:text-white focus:ring-2 focus:ring-purple-500 transition"
                      placeholder="Keluhan pasien saat datang"></textarea>
                  </div>
                  <div class="col-span-2">
                    <label class="block text-sm font-medium text-slate-700 dark:text-gray-300 mb-2">Riwayat Penyakit</label>
                    <textarea name="riwayat_penyakit" rows="2" 
                      class="w-full px-4 py-3 bg-white dark:bg-gray-700 border border-slate-300 dark:border-gray-600 rounded-lg text-slate-800 dark:text-white focus:ring-2 focus:ring-purple-500 transition"></textarea>
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-gray-300 mb-2">Riwayat Pengobatan</label>
                    <textarea name="riwayat_pengobatan" rows="2" 
                      class="w-full px-4 py-3 bg-white dark:bg-gray-700 border border-slate-300 dark:border-gray-600 rounded-lg text-slate-800 dark:text-white focus:ring-2 focus:ring-purple-500 transition"></textarea>
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-gray-300 mb-2">Riwayat Operasi</label>
                    <textarea name="riwayat_operasi" rows="2" 
                      class="w-full px-4 py-3 bg-white dark:bg-gray-700 border border-slate-300 dark:border-gray-600 rounded-lg text-slate-800 dark:text-white focus:ring-2 focus:ring-purple-500 transition"></textarea>
                  </div>
                  <div class="col-span-2">
                    <label class="block text-sm font-medium text-slate-700 dark:text-gray-300 mb-2">Alergi</label>
                    <input type="text" name="alergi" 
                      class="w-full px-4 py-3 bg-white dark:bg-gray-700 border border-slate-300 dark:border-gray-600 rounded-lg text-slate-800 dark:text-white focus:ring-2 focus:ring-purple-500 transition"
                      placeholder="Contoh: Penisilin, Seafood">
                  </div>
                </div>
              </div>

              <!-- Vital Signs Tab -->
              <div id="med-content-vital" class="med-tab-content hidden">
                <div class="grid grid-cols-2 gap-6">
                  <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-gray-300 mb-2">Tekanan Darah</label>
                    <input type="text" name="tekanan_darah" 
                      class="w-full px-4 py-3 bg-white dark:bg-gray-700 border border-slate-300 dark:border-gray-600 rounded-lg text-slate-800 dark:text-white focus:ring-2 focus:ring-purple-500 transition"

                  <div>

                      placeholder="Hasil rontgen"></textarea>

                  <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-gray-300 mb-2">CT Scan</label>
                    <textarea name="ct_scan" rows="2" 
                      class="w-full px-4 py-3 bg-white dark:bg-gray-700 border border-slate-300 dark:border-gray-600 rounded-lg text-slate-800 dark:text-white focus:ring-2 focus:ring-purple-500 transition"

                  <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-gray-300 mb-2">USG</label>

              <!-- Diagnosis & Tindakan Tab -->
              <div id="med-content-diagnosis" class="med-tab-content hidden">
                <div class="grid grid-cols-1 gap-6">
                  <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-gray-300 mb-2">Diagnosis Awal</label>
                    <textarea name="diagnosis_awal" rows="2" 
                      class="w-full px-4 py-3 bg-white dark:bg-gray-700 border border-slate-300 dark:border-gray-600 rounded-lg text-slate-800 dark:text-white focus:ring-2 focus:ring-purple-500 transition"
                      placeholder="Diagnosis saat pasien masuk"></textarea>
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-gray-300 mb-2">Komorbid</label>
                    <textarea name="komorbid" rows="2" 
                      class="w-full px-4 py-3 bg-white dark:bg-gray-700 border border-slate-300 dark:border-gray-600 rounded-lg text-slate-800 dark:text-white focus:ring-2 focus:ring-purple-500 transition"
                      placeholder="Penyakit penyerta"></textarea>
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-gray-300 mb-2">Komplikasi</label>
                    <textarea name="komplikasi" rows="2" 
                      class="w-full px-4 py-3 bg-white dark:bg-gray-700 border border-slate-300 dark:border-gray-600 rounded-lg text-slate-800 dark:text-white focus:ring-2 focus:ring-purple-500 transition"
                      placeholder="Komplikasi yang timbul"></textarea>
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-gray-300 mb-2">Diagnosis Akhir</label>
                    <textarea name="diagnosis_akhir" rows="2" 
                      class="w-full px-4 py-3 bg-white dark:bg-gray-700 border border-slate-300 dark:border-gray-600 rounded-lg text-slate-800 dark:text-white focus:ring-2 focus:ring-purple-500 transition"
                      placeholder="Diagnosis final"></textarea>

                  <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-gray-300 mb-2">Tindakan</label>
                    <textarea name="tindakan" rows="3" 
                      class="w-full px-4 py-3 bg-white dark:bg-gray-700 border border-slate-300 dark:border-gray-600 rounded-lg text-slate-800 dark:text-white focus:ring-2 focus:ring-purple-500 transition"
                      placeholder="Tindakan medis yang dilakukan"></textarea>

              <!-- Medication Tab -->
              <div id="med-content-medication" class="med-tab-content hidden">
                <div class="grid grid-cols-1 gap-6">
                  <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-gray-300 mb-2">Obat</label>
                    <textarea name="obat" rows="4" 
                      class="w-full px-4 py-3 bg-white dark:bg-gray-700 border border-slate-300 dark:border-gray-600 rounded-lg text-slate-800 dark:text-white focus:ring-2 focus:ring-purple-500 transition"
                      placeholder="Daftar obat yang diberikan"></textarea>
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-gray-300 mb-2">Validasi Fornas</label>
                    <textarea name="validasi_fornas" rows="2" 
                      class="w-full px-4 py-3 bg-white dark:bg-gray-700 border border-slate-300 dark:border-gray-600 rounded-lg text-slate-800 dark:text-white focus:ring-2 focus:ring-purple-500 transition"
                      placeholder="Validasi obat terhadap Fornas"></textarea>
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-gray-300 mb-2">Catatan Dokter</label>
                    <textarea name="notes_doctor" rows="4" 
                      class="w-full px-4 py-3 bg-white dark:bg-gray-700 border border-slate-300 dark:border-gray-600 rounded-lg text-slate-800 dark:text-white focus:ring-2 focus:ring-purple-500 transition"
                      placeholder="Catatan tambahan dari dokter"></textarea>

            </div>
          </div>

          <div class="flex justify-end gap-4 pt-4 border-t border-slate-200 dark:border-gray-700">
            <button type="button" onclick="resetForm('formMedical')" 
              class="px-6 py-3 bg-slate-200 dark:bg-gray-700 hover:bg-slate-300 dark:hover:bg-gray-600 text-slate-800 dark:text-white rounded-lg transition-colors">
              Reset
            </button>
            
            <!-- Step Navigation Buttons -->
            <div id="medicalNavButtons" class="flex gap-3">
              <!-- Next buttons for tabs 1-4 -->
              <button type="button" id="btnNext1" onclick="switchMedicalTab('vital')" 
                class="px-8 py-3 bg-gradient-to-r from-purple-600 to-purple-700 hover:from-purple-700 hover:to-purple-800 text-white rounded-lg shadow-lg shadow-purple-500/30 transition-all duration-200 transform hover:scale-105 font-semibold">
                Selanjutnya →
              </button>
              <button type="button" id="btnNext2" onclick="switchMedicalTab('lab')" 
                class="hidden px-8 py-3 bg-gradient-to-r from-purple-600 to-purple-700 hover:from-purple-700 hover:to-purple-800 text-white rounded-lg shadow-lg shadow-purple-500/30 transition-all duration-200 transform hover:scale-105 font-semibold">
                Selanjutnya →
              </button>
              <button type="button" id="btnNext3" onclick="switchMedicalTab('diagnosis')" 
                class="hidden px-8 py-3 bg-gradient-to-r from-purple-600 to-purple-700 hover:from-purple-700 hover:to-purple-800 text-white rounded-lg shadow-lg shadow-purple-500/30 transition-all duration-200 transform hover:scale-105 font-semibold">
                Selanjutnya →
              </button>
              <button type="button" id="btnNext4" onclick="switchMedicalTab('medication')" 
                class="hidden px-8 py-3 bg-gradient-to-r from-purple-600 to-purple-700 hover:from-purple-700 hover:to-purple-800 text-white rounded-lg shadow-lg shadow-purple-500/30 transition-all duration-200 transform hover:scale-105 font-semibold">
                Selanjutnya →
              </button>
              
              <!-- Submit button only on last tab -->
              <button type="submit" id="btnSubmitMedical"
                class="hidden px-8 py-3 bg-gradient-to-r from-purple-600 to-purple-700 hover:from-purple-700 hover:to-purple-800 text-white rounded-lg shadow-lg shadow-purple-500/30 transition-all duration-200 transform hover:scale-105 font-semibold">
                Simpan
              </button>
            </div>
          </div>
        </form>
      </div>

    </div>
  </div>
</div>

<!-- JavaScript -->
<script>
  // ========== THEME MANAGEMENT ==========
  let isDark = false;

  function initTheme() {
    isDark = localStorage.getItem('theme') === 'dark';
    applyTheme();
  }

  function toggleTheme() {
    isDark = !isDark;
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    applyTheme();
  }

  function applyTheme() {
    if (isDark) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  }

  // Initialize theme on page load
  initTheme();

  // ========== INITIALIZE SELECT2 ==========
  $(document).ready(function() {
    // Initialize Select2 for patient dropdown
    $('.select2-patient').select2({
      placeholder: '-- Ketik untuk mencari pasien --',
      allowClear: true,
      width: '100%'
    });

    // Initialize Select2 for visit dropdown
    $('.select2-visit').select2({
      placeholder: '-- Ketik untuk mencari kunjungan --',
      allowClear: true,
      width: '100%'
    });
  });

  // ========== AUTO HOSPITAL ID ==========
  async function getCurrentHospitalId() {
    const hospitalId = localStorage.getItem('user_hospital_id');
    if (hospitalId) return hospitalId;

    try {
      const res = await fetch('/datahub/api/user/current');
      const user = await res.json();
      return user.hospital_id || 'RS001';
    } catch (err) {
      console.warn('Failed to get hospital_id, using default');
      return 'RS001';
    }
  }

  async function setHospitalIds() {
    const hospitalId = await getCurrentHospitalId();
    document.getElementById('patient_hospital_id').value = hospitalId;
    document.getElementById('visit_hospital_id').value = hospitalId;
    document.getElementById('medical_hospital_id').value = hospitalId;
  }

  setHospitalIds();

  // ========== MEDICAL RECORD TAB SWITCHING WITH STEP NAVIGATION ==========
  function switchMedicalTab(tab) {
    // Hide all medical tabs
    document.querySelectorAll('.med-tab-content').forEach(el => el.classList.add('hidden'));
    
    // Remove active state from all medical tab buttons
    document.querySelectorAll('[id^="med-tab-"]').forEach(el => {
      el.classList.remove('border-purple-500', 'text-purple-600', 'dark:text-purple-400');
      el.classList.add('border-transparent', 'text-slate-600', 'dark:text-gray-400');
    });
    
    // Show selected tab
    document.getElementById('med-content-' + tab).classList.remove('hidden');
    
    // Activate selected tab button
    const tabBtn = document.getElementById('med-tab-' + tab);
    tabBtn.classList.remove('border-transparent', 'text-slate-600', 'dark:text-gray-400');
    tabBtn.classList.add('border-purple-500', 'text-purple-600', 'dark:text-purple-400');
    
    // Update navigation buttons
    updateMedicalNavButtons(tab);
  }

  // ========== UPDATE NAV BUTTONS BASED ON CURRENT TAB ==========
  function updateMedicalNavButtons(currentTab) {
    // Hide all buttons first
    document.getElementById('btnNext1').classList.add('hidden');
    document.getElementById('btnNext2').classList.add('hidden');
    document.getElementById('btnNext3').classList.add('hidden');
    document.getElementById('btnNext4').classList.add('hidden');
    document.getElementById('btnSubmitMedical').classList.add('hidden');
    
    // Show appropriate button based on current tab
    switch(currentTab) {
      case 'basic':
        document.getElementById('btnNext1').classList.remove('hidden');
        break;
      case 'vital':
        document.getElementById('btnNext2').classList.remove('hidden');
        break;
      case 'lab':
        document.getElementById('btnNext3').classList.remove('hidden');
        break;
      case 'diagnosis':
        document.getElementById('btnNext4').classList.remove('hidden');
        break;
      case 'medication':
        // Last tab - show submit button
        document.getElementById('btnSubmitMedical').classList.remove('hidden');
        break;
    }
  }

  // ========== TAB SWITCHING (Main Tabs) ==========
  function switchTab(tab) {
    // Hide all tabs
    document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
    
    // Remove active state from all tab buttons
    document.querySelectorAll('[id^="tab-"]').forEach(el => {
      el.classList.remove('border-blue-500', 'bg-slate-100', 'dark:bg-gray-700/50', 'text-blue-600', 'dark:text-blue-400', 
                         'border-green-500', 'text-green-600', 'dark:text-green-400',
                         'border-purple-500', 'text-purple-600', 'dark:text-purple-400');
      el.classList.add('border-transparent', 'text-slate-600', 'dark:text-gray-400');
    });
    
    // Show selected tab
    document.getElementById('content-' + tab).classList.remove('hidden');
    
    // Activate selected tab button
    const tabBtn = document.getElementById('tab-' + tab);
    tabBtn.classList.remove('border-transparent', 'text-slate-600', 'dark:text-gray-400');
    
    if (tab === 'patient') {
      tabBtn.classList.add('border-blue-500', 'bg-slate-100', 'dark:bg-gray-700/50', 'text-blue-600', 'dark:text-blue-400');
    } else if (tab === 'visit') {
      tabBtn.classList.add('border-green-500', 'bg-slate-100', 'dark:bg-gray-700/50', 'text-green-600', 'dark:text-green-400');
    } else if (tab === 'medical') {
      tabBtn.classList.add('border-purple-500', 'bg-slate-100', 'dark:bg-gray-700/50', 'text-purple-600', 'dark:text-purple-400');
    }
  }

  // ========== ALERT ==========
  function showAlert(msg, type = 'success') {
    const alertBox = document.getElementById('alertBox');
    alertBox.textContent = msg;
    alertBox.className = 'mb-6 p-4 rounded-xl text-white shadow-lg ' + 
      (type === 'success' 
        ? 'bg-gradient-to-r from-green-600 to-green-700' 
        : 'bg-gradient-to-r from-red-600 to-red-700');
    alertBox.classList.remove('hidden');
    
    setTimeout(() => alertBox.classList.add('hidden'), 5000);
  }

  // ========== RESET FORM ==========
  function resetForm(formId) {
    document.getElementById(formId).reset();
    setHospitalIds();
    
    // If medical form, reset to first tab
    if (formId === 'formMedical') {
      switchMedicalTab('basic');
    }
  }

  // ========== SUBMIT HANDLERS ==========
  document.getElementById('formPatient').addEventListener('submit', async function(e) {
    e.preventDefault();
    const formData = new FormData(e.target);
    const data = Object.fromEntries(formData.entries());
    
    try {
      const res = await fetch('/datahub/manual/patient', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      
      const result = await res.json();
      
      if (res.ok) {
        showAlert(result.message || '✅ Pasien berhasil ditambahkan', 'success');
        resetForm('formPatient');
      } else {
        throw new Error(result.detail || 'Failed to create patient');
      }
    } catch (err) {
      showAlert('❌ Error: ' + err.message, 'error');
    }
  });

  document.getElementById('formVisit').addEventListener('submit', async function(e) {
    e.preventDefault();
    const formData = new FormData(e.target);
    const data = Object.fromEntries(formData.entries());
    
    if (data.patient_id) data.patient_id = parseInt(data.patient_id);
    if (data.lama_rawat) data.lama_rawat = parseInt(data.lama_rawat);
    if (data.visit_no) data.visit_no = parseInt(data.visit_no);
    
    try {
      const res = await fetch('/datahub/manual/visit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      
      const result = await res.json();
      
      if (res.ok) {
        showAlert(result.message || '✅ Kunjungan berhasil ditambahkan', 'success');
        resetForm('formVisit');
      } else {
        throw new Error(result.detail || 'Failed to create visit');
      }
    } catch (err) {
      showAlert('❌ Error: ' + err.message, 'error');
    }
  });

  document.getElementById('formMedical').addEventListener('submit', async function(e) {
    e.preventDefault();
    const formData = new FormData(e.target);
    const data = Object.fromEntries(formData.entries());
    
    if (data.visit_id) data.visit_id = parseInt(data.visit_id);
    if (data.patient_id) data.patient_id = parseInt(data.patient_id);
    
    try {
      const res = await fetch('/datahub/manual/medical_record', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      
      const result = await res.json();
      
      if (res.ok) {
        showAlert(result.message || '✅ Rekam Medis berhasil ditambahkan', 'success');
        resetForm('formMedical');
      } else {
        throw new Error(result.detail || 'Failed to create medical record');
      }
    } catch (err) {
      showAlert('❌ Error: ' + err.message, 'error');
    }
  });

  // ========== HELPER FUNCTIONS - LOAD PATIENTS ==========
  async function loadPatients() {
    try {
      const hospitalId = await getCurrentHospitalId();
      const res = await fetch(`/manual/patients?limit=100&hospital_id=${hospitalId}`);
      const result = await res.json();
      
      if (result.status === 'success' && result.data.length > 0) {
        const select = $('#visit_patient_id');
        select.empty();
        select.append(new Option('-- Pilih Pasien --', '', false, false));
        
        result.data.forEach(p => {
          const optionText = `${p.nama} - ${p.patient_uuid} (${p.hospital_id})`;
          select.append(new Option(optionText, p.id, false, false));
        });
        
        // Trigger change to update Select2
        select.trigger('change');
        
        showAlert('✅ Daftar pasien berhasil dimuat', 'success');
      } else {
        showAlert('⚠️ Belum ada pasien. Tambahkan pasien terlebih dahulu.', 'error');
      }
    } catch (err) {
      showAlert('❌ Gagal memuat daftar pasien', 'error');
    }
  }

  // ========== HELPER FUNCTIONS - LOAD VISITS ==========
  async function loadVisits() {
    try {
      const hospitalId = await getCurrentHospitalId();
      const res = await fetch(`/manual/visits?limit=100`);
      const result = await res.json();
      
      if (result.status === 'success' && result.data.length > 0) {
        const select = $('#medical_visit_id');
        select.empty();
        select.append(new Option('-- Pilih Kunjungan --', '', false, false));
        
        result.data.forEach(v => {
          const optionText = `${v.patient_name} | ${v.tanggal_kunjungan} - ${v.jenis_rawat}`;
          select.append(new Option(optionText, v.id, false, false));
        });
        
        // Trigger change to update Select2
        select.trigger('change');
        
        showAlert('✅ Daftar kunjungan berhasil dimuat', 'success');
      } else {
        showAlert('⚠️ Belum ada kunjungan. Tambahkan kunjungan terlebih dahulu.', 'error');
      }
    } catch (err) {
      showAlert('❌ Gagal memuat daftar kunjungan', 'error');
    }
  }
</script>

</body>
</html>
