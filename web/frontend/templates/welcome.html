{% extends "base.html" %}
{% block content %}
<div class="flex items-center justify-center min-h-[80vh] bg-gray-100 dark:bg-gray-900 transition-colors duration-300">
  <div class="bg-white dark:bg-gray-800 shadow-lg rounded-2xl p-10 text-center max-w-sm w-full transition-colors duration-300">
    <!-- Logo + Title -->
    <div class="mb-0">
      <img src="{{ url_for('static', path='images/bannersplash.jpg') }}" alt="AI-Claim Logo" class="mx-auto w-80 mb-4">
    </div>

    <!-- Button -->
    <form method="get" action="/login">
      <button type="submit"
        class="w-full bg-blue-700 dark:bg-blue-600 text-white font-semibold py-2 rounded-lg hover:bg-blue-800 dark:hover:bg-blue-500 transition-colors duration-300">
        Mulai Sekarang
      </button>
    </form>
  </div>
</div>
{% endblock %}
