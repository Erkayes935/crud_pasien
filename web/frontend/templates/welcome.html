{% extends "base.html" %}
{% block content %}
<div class="min-h-screen bg-gradient-to-br from-slate-50 via-white to-blue-50 flex items-center justify-center px-4 overflow-hidden relative">

  <!-- Efek radial gradien -->
  <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-blue-100/40 via-transparent to-transparent"></div>

  <!-- Efek blur lingkaran -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-40 -right-40 w-80 h-80 bg-blue-400/10 rounded-full blur-3xl animate-pulse"></div>
    <div class="absolute -bottom-40 -left-40 w-80 h-80 bg-blue-300/10 rounded-full blur-3xl animate-pulse" style="animation-delay:1s;"></div>
  </div>

  <!-- Konten utama -->
  <div class="relative z-10 max-w-4xl w-full text-center space-y-8 animate-fade-in">

    <!-- Logo -->
    <div class="flex justify-center mb-6">
      <div class="relative group">
        <div class="absolute inset-0 bg-blue-500/20 rounded-full blur-xl group-hover:blur-2xl transition-all duration-500"></div>
        <img
          src="{{ url_for('static', path='images/bannersplash.png') }}"
          alt="AI-Claim Logo"
          class="relative w-64 h-auto mx-auto select-none drop-shadow-2xl transform group-hover:scale-105 transition-transform duration-500"
          draggable="false"
        />
      </div>
    </div>

    <!-- Judul -->
    <div class="space-y-4">
      <h1 class="text-5xl md:text-6xl font-bold text-gray-900 tracking-tight">
        Welcome to <span class="text-blue-600">AI-Claim</span>
      </h1>
      <p class="text-xl md:text-2xl text-gray-600 max-w-2xl mx-auto leading-relaxed">
        Solusi cerdas untuk manajemen klaim yang efisien dan otomatis
      </p>
    </div>

    <!-- Fitur -->
    <div class="flex flex-wrap justify-center gap-8 py-8">
      <div class="flex items-center gap-3 text-gray-700">
        <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2l4-4m6 2a9 9 0 11-18 0a9 9 0 0118 0z" />
          </svg>
        </div>
        <span class="text-lg">Cepat & Akurat</span>
      </div>
      <div class="flex items-center gap-3 text-gray-700">
        <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2l4-4m6 2a9 9 0 11-18 0a9 9 0 0118 0z" />
          </svg>
        </div>
        <span class="text-lg">AI-Powered</span>
      </div>
      <div class="flex items-center gap-3 text-gray-700">
        <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2l4-4m6 2a9 9 0 11-18 0a9 9 0 0118 0z" />
          </svg>
        </div>
        <span class="text-lg">Aman & Terpercaya</span>
      </div>
    </div>

    <!-- Tombol -->
    <div class="pt-4">
      <form method="get" action="/login">
        <button
          type="submit"
          class="group relative inline-flex items-center gap-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-lg px-8 py-4 rounded-full shadow-lg hover:shadow-xl transform hover:scale-105 transition-all duration-300"
        >
          <span>Mulai Sekarang</span>
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 group-hover:translate-x-1 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6" />
          </svg>
          <div class="absolute inset-0 rounded-full bg-white/20 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
        </button>
      </form>
    </div>

    <!-- Footer kecil -->
    <div class="pt-8 text-sm text-gray-500">
      <p>Mulai perjalanan digital Anda bersama AI-Claim</p>
    </div>
  </div>
</div>
{% endblock %}
