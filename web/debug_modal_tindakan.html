<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Modal Tindakan</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-2xl font-bold mb-6">Debug Modal Tindakan</h1>
        
        <div class="bg-white p-6 rounded shadow-lg mb-6">
            <h2 class="text-lg font-semibold mb-4">Test openProcedureModal</h2>
            
            <div class="space-y-4">
                <button onclick="testProcedureModal1()" 
                        class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                    Test: X-ray Thorax (kode: 87.44)
                </button>
                
                <button onclick="testProcedureModal2()" 
                        class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
                    Test: Antibiotik IV (kode: 99.29)
                </button>
                
                <button onclick="testProcedureModal3()" 
                        class="bg-purple-600 text-white px-4 py-2 rounded hover:bg-purple-700">
                    Test: Nebulizer (kode: 93.94)
                </button>
            </div>
            
            <div class="mt-6 p-4 bg-gray-100 rounded">
                <h3 class="font-semibold mb-2">Debug Info:</h3>
                <div id="debug-info" class="text-sm font-mono"></div>
            </div>
        </div>
        
        <div class="bg-white p-6 rounded shadow-lg">
            <h2 class="text-lg font-semibold mb-4">Sample Tindakan HTML</h2>
            <div id="tindakan-sample"></div>
        </div>
    </div>

    <!-- Mock claimRoot untuk testing -->
    <div id="claimRoot" data-claim-id="123" style="display: none;"></div>

    <script src="backend/static/js/claim.modals.js"></script>
    <script>
        // Mock modal function
        function openModal(title, content, options = {}) {
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50';
            modal.innerHTML = `
                <div class="bg-white max-w-4xl max-h-screen overflow-auto p-6 rounded shadow-lg relative">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-bold">${title}</h2>
                        <button onclick="this.closest('.fixed').remove()" class="text-red-500 hover:text-red-700 text-xl font-bold">×</button>
                    </div>
                    <div>${content}</div>
                </div>
            `;
            document.body.appendChild(modal);
        }
        
        function updateDebugInfo(info) {
            document.getElementById('debug-info').innerHTML += `<div>${new Date().toLocaleTimeString()}: ${info}</div>`;
        }
        
        async function testProcedureModal1() {
            updateDebugInfo("Testing X-ray Thorax...");
            await openProcedureModal("87.44", "X-ray Thorax");
        }
        
        async function testProcedureModal2() {
            updateDebugInfo("Testing Antibiotik IV...");
            await openProcedureModal("99.29", "Antibiotik IV");
        }
        
        async function testProcedureModal3() {
            updateDebugInfo("Testing Nebulizer...");
            await openProcedureModal("93.94", "Nebulizer");
        }
        
        // Generate sample tindakan HTML
        const sampleTindakan = [
            { nama: "X-ray Thorax", kode: "87.44", deskripsi: "Radiografi dada" },
            { nama: "Antibiotik IV", kode: "99.29", deskripsi: "Pemberian antibiotik intravena" },
            { nama: "Nebulizer", kode: "93.94", deskripsi: "Terapi inhalasi" }
        ];
        
        window.addEventListener('DOMContentLoaded', function() {
            const sampleHtml = renderTindakan(sampleTindakan);
            document.getElementById('tindakan-sample').innerHTML = sampleHtml;
        });
        
        // Override console.log untuk debug
        const originalLog = console.log;
        console.log = function(...args) {
            originalLog.apply(console, args);
            updateDebugInfo(args.join(' '));
        };
        
        const originalError = console.error;
        console.error = function(...args) {
            originalError.apply(console, args);
            updateDebugInfo(`ERROR: ${args.join(' ')}`);
        };
    </script>
</body>
</html>
